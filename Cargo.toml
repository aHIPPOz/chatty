[package]
name = "chatty"
version = "0.1.0"
edition = "2021"
description = "🐧 Modern desktop shell prototype in Slint+Rust"
license = "MIT"

[dependencies]
slint = "1.14.1"

# WASM-only
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "0.2"

# Native Linux/Wayland (future)
[target.'cfg(target_os = "linux")'.dependencies]
# smithay = { version = "0.3", features = ["desktop", "render"] }
# wayland-server = "0.30"
# calloop = "0.12"

[build-dependencies]
slint-build = "1.14.1"

# WASM library (web demo)
[lib]
path = "src/lib.rs"
crate-type = ["cdylib"]

# Native binary (Linux/Wayland)
[[bin]]
name = "chatty"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
